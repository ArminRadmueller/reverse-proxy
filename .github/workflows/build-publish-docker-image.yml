name: Build and Publish images to Docker Hub

on:
  push:
    branches: [ "master" ]

jobs:

  build_publish:

    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: build image
      run: docker build . --file Dockerfile --tag arminradmueller/reverse-proxy:latest
    - name: push to Docker Hub
      run: |
           docker login -u arminradmueller -p ${{ secrets.DOCKERHUB_TOKEN }}
           docker push arminradmueller/reverse-proxy:latest
